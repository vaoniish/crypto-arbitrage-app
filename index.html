<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arbitrage Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        .card-glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
        }
        .card-sub {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
        }
        .btn-action {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .btn-action:active {
            transform: scale(0.96);
            background: #334155;
        }
        .nav-fixed {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            z-index: 50;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 6px;
        }
        .nav-tab {
            border-radius: 20px;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .nav-tab.active {
            background: #0ea5e9;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-28">

    <!-- Верхний бар -->
    <div class="px-4 pt-4 pb-2 flex justify-between items-center border-b border-slate-800/60">
        <div class="flex items-center gap-3">
            <div id="user-avatar" class="w-10 h-10 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold text-sm border border-sky-500/30">
                U
            </div>
            <div>
                <div class="text-xs text-slate-400 font-medium">Арбитражный Терминал</div>
                <div id="user-name" class="text-sm font-bold text-white">Трейдер</div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-[11px] font-semibold border border-emerald-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                LIVE
            </span>
        </div>
    </div>

    <!-- Основной контент -->
    <main id="tab-content" class="px-4 pt-3 flex-1">
        <!-- Генерация через JS -->
    </main>

    <!-- Нижнее меню -->
    <div class="nav-fixed">
        <div class="grid grid-cols-4 gap-1 text-center">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-tab active py-2 flex flex-col items-center">
                <i class="bi bi-grid-1x2-fill text-base"></i>
                <span class="text-[10px] font-semibold mt-0.5">Главная</span>
            </button>
            <button onclick="switchTab('deals')" id="nav-deals" class="nav-tab py-2 flex flex-col items-center">
                <i class="bi bi-lightning-charge-fill text-base"></i>
                <span class="text-[10px] font-semibold mt-0.5">Связки</span>
            </button>
            <button onclick="switchTab('analytics')" id="nav-analytics" class="nav-tab py-2 flex flex-col items-center">
                <i class="bi bi-graph-up-arrow text-base"></i>
                <span class="text-[10px] font-semibold mt-0.5">Рынок</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="nav-tab py-2 flex flex-col items-center">
                <i class="bi bi-sliders text-base"></i>
                <span class="text-[10px] font-semibold mt-0.5">Фильтры</span>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp || {};
        if (tg.expand) tg.expand();

        // Укажи URL своего задеплоенного сервера на Render
        const BACKEND_URL = "https://arbitrage-backend.onrender.com/api/deals"; 
        
        let userDeposit = 500;
        let minProfitFilter = -5.0;
        let currentTab = 'dashboard';
        let dealsCache = [];
        let lastScanSec = 0;

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');
            render();
        }

        async function fetchDeals() {
            try {
                const res = await fetch(`${BACKEND_URL}?deposit=${userDeposit}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                dealsCache = data.deals || [];
                lastScanSec = data.scan_time_sec || 0;
                if (currentTab === 'dashboard' || currentTab === 'deals') render();
            } catch (e) {
                console.log("Ожидание ответа бэкенда...");
            }
        }

        function render() {
            const container = document.getElementById('tab-content');

            if (tg.initDataUnsafe?.user) {
                document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
                document.getElementById('user-avatar').innerText = tg.initDataUnsafe.user.first_name[0];
            }

            if (currentTab === 'dashboard') {
                const bestDeal = dealsCache[0];
                const positiveDeals = dealsCache.filter(d => d.profit_pct > 0).length;

                container.innerHTML = `
                    <div class="card-glass p-5 mb-4 relative overflow-hidden">
                        <div class="text-xs text-slate-400 font-medium">Рабочий капитал</div>
                        <div class="flex justify-between items-baseline mt-1 mb-4">
                            <div class="text-3xl font-extrabold text-white">$${userDeposit}<span class="text-lg text-slate-400 font-normal">.00</span></div>
                            <button onclick="changeDeposit()" class="text-xs text-sky-400 font-semibold bg-sky-500/10 px-3 py-1.5 rounded-xl border border-sky-500/20">
                                Изменить
                            </button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-3 border-t border-slate-700/50">
                            <div>
                                <span class="text-[10px] text-slate-400 block">Найдено связок</span>
                                <span class="text-sm font-bold text-white">${dealsCache.length} пар</span>
                            </div>
                            <div>
                                <span class="text-[10px] text-slate-400 block">Плюсовых (>0%)</span>
                                <span class="text-sm font-bold text-emerald-400">${positiveDeals} доступно</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 mb-5">
                        <button onclick="switchTab('deals')" class="btn-action p-3 rounded-2xl text-center">
                            <i class="bi bi-search text-sky-400 text-xl block mb-1"></i>
                            <span class="text-[11px] font-semibold text-slate-200">Сканер</span>
                        </button>
                        <button onclick="fetchDeals()" class="btn-action p-3 rounded-2xl text-center">
                            <i class="bi bi-arrow-clockwise text-emerald-400 text-xl block mb-1"></i>
                            <span class="text-[11px] font-semibold text-slate-200">Обновить</span>
                        </button>
                        <button onclick="switchTab('settings')" class="btn-action p-3 rounded-2xl text-center">
                            <i class="bi bi-sliders text-purple-400 text-xl block mb-1"></i>
                            <span class="text-[11px] font-semibold text-slate-200">Фильтры</span>
                        </button>
                    </div>

                    <div class="mb-2 flex justify-between items-center px-1">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Топовая связка сейчас</span>
                        <span class="text-[11px] text-sky-400 cursor-pointer" onclick="switchTab('deals')">Все связки &rarr;</span>
                    </div>

                    ${bestDeal ? `
                    <div class="card-glass p-4 border-l-4 border-l-emerald-500 mb-5">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-0.5 rounded bg-sky-500/20 text-sky-400 font-bold text-xs">${bestDeal.symbol}</span>
                                <span class="text-[11px] text-slate-400">Сеть: ${bestDeal.network}</span>
                            </div>
                            <span class="text-emerald-400 font-extrabold text-sm">+${bestDeal.profit_pct}%</span>
                        </div>
                        <div class="card-sub p-2.5 flex justify-between text-xs mt-2">
                            <div><span class="text-slate-400">Купить:</span> <b>${bestDeal.buy_ex}</b> ($${bestDeal.buy_price})</div>
                            <div><span class="text-slate-400">Продать:</span> <b>${bestDeal.sell_ex}</b> ($${bestDeal.sell_price})</div>
                        </div>
                    </div>
                    ` : '<div class="card-glass p-4 text-center text-xs text-slate-500 mb-5">Сканирование стаканов бирж...</div>'}
                `;
            } else if (currentTab === 'deals') {
                const filtered = dealsCache.filter(d => d.profit_pct >= minProfitFilter);

                let dealsHtml = '';
                filtered.forEach(d => {
                    const isPos = d.profit_pct >= 0;
                    dealsHtml += `
                    <div class="card-glass p-3.5 mb-2.5">
                        <div class="flex justify-between items-center mb-2">
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold text-xs">
                                    ${d.coin}
                                </div>
                                <div>
                                    <div class="font-bold text-xs text-white">${d.symbol}</div>
                                    <div class="text-[10px] text-slate-400">Сеть: ${d.network}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="${isPos ? 'text-emerald-400' : 'text-rose-400'} font-extrabold text-sm">
                                    ${isPos ? '+' : ''}$${d.profit_usd}
                                </div>
                                <div class="text-[10px] ${isPos ? 'text-emerald-400 bg-emerald-500/10' : 'text-rose-400 bg-rose-500/10'} font-bold px-1.5 py-0.5 rounded inline-block">
                                    ${isPos ? '+' : ''}${d.profit_pct}%
                                </div>
                            </div>
                        </div>

                        <div class="card-sub p-2 grid grid-cols-2 gap-2 text-[11px]">
                            <div>
                                <span class="text-slate-400 block text-[9px]">ПОКУПКА (${d.buy_ex})</span>
                                <span class="text-slate-200 font-mono">$${d.buy_price}</span>
                            </div>
                            <div class="border-l border-slate-700/50 pl-2">
                                <span class="text-slate-400 block text-[9px]">ПРОДАЖА (${d.sell_ex})</span>
                                <span class="text-slate-200 font-mono">$${d.sell_price}</span>
                            </div>
                        </div>
                    </div>`;
                });

                container.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-bold text-white">Мониторинг связок</h2>
                        <span class="text-xs text-sky-400 bg-sky-500/10 px-2.5 py-1 rounded-lg">${filtered.length} пар</span>
                    </div>
                    <div class="space-y-2">
                        ${dealsHtml || '<div class="text-center py-12 text-xs text-slate-500">Подходящих связок не найдено</div>'}
                    </div>
                `;
            } else if (currentTab === 'settings') {
                container.innerHTML = `
                    <div class="card-glass p-4 space-y-4 text-xs">
                        <div>
                            <label class="text-slate-400 block mb-1 font-medium">Минимальный профит (%)</label>
                            <input type="number" step="0.5" value="${minProfitFilter}" onchange="minProfitFilter = parseFloat(this.value)" 
                                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1 font-medium">Депозит ($)</label>
                            <input type="number" value="${userDeposit}" onchange="userDeposit = parseFloat(this.value); render();" 
                                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none focus:border-sky-500">
                        </div>
                    </div>
                `;
            }
        }

        function changeDeposit() {
            const val = prompt("Введите сумму депозита ($):", userDeposit);
            if (val && !isNaN(val)) {
                userDeposit = parseFloat(val);
                render();
            }
        }

        setInterval(fetchDeals, 3000);
        render();
    </script>
</body>
</html>
