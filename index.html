<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arbitrage Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #17212b;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        .wallet-card { background-color: #232e3c; border-radius: 16px; }
        .wallet-card-sub { background-color: #1e2733; border-radius: 12px; }
        .wallet-btn { background-color: #232e3c; border-radius: 16px; cursor: pointer; transition: all 0.1s ease; }
        .wallet-btn:active { transform: scale(0.97); background-color: #2b3746; }
        
        .wallet-nav-container {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 50;
        }
        .wallet-nav {
            background-color: rgba(35, 46, 60, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .nav-item {
            border-radius: 24px;
            padding: 6px 0;
            color: #8b9db1;
            transition: all 0.2s ease;
        }
        .nav-item.active {
            background-color: #2b3848;
            color: #38bdf8;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-4 pb-28">

    <div id="tab-content">
        <!-- Контент вкладки -->
    </div>

    <!-- Плавающее меню Wallet -->
    <div class="wallet-nav-container">
        <div class="wallet-nav grid grid-cols-4 gap-1">
            <button onclick="switchTab('deals')" id="nav-deals" class="nav-item active flex flex-col items-center justify-center">
                <i class="bi bi-arrow-left-right text-lg mb-0.5"></i>
                <span class="text-[10px] font-semibold">Связки</span>
            </button>
            <button onclick="switchTab('exchanges')" id="nav-exchanges" class="nav-item flex flex-col items-center justify-center">
                <i class="bi bi-shop text-lg mb-0.5"></i>
                <span class="text-[10px] font-semibold">Биржи</span>
            </button>
            <button onclick="switchTab('stats')" id="nav-stats" class="nav-item flex flex-col items-center justify-center">
                <i class="bi bi-pie-chart-fill text-lg mb-0.5"></i>
                <span class="text-[10px] font-semibold">Доход</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="nav-item flex flex-col items-center justify-center">
                <i class="bi bi-person-fill text-lg mb-0.5"></i>
                <span class="text-[10px] font-semibold">Профиль</span>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp || {};
        if (tg.expand) tg.expand();

        // Укажи URL своего сервера на Render
        const BACKEND_URL = "https://arbitrage-backend-z4mq.onrender.com/api/deals"; 
        let userDeposit = 500;
        let currentTab = 'deals';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');
            renderView();
        }

        async function fetchDeals() {
            try {
                const res = await fetch(BACKEND_URL);
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                if (currentTab === 'deals') renderDealsList(data);
            } catch (e) {
                if (currentTab === 'deals') {
                    const listContainer = document.getElementById('deals-container');
                    if (listContainer) {
                        listContainer.innerHTML = `
                            <div class="text-center text-rose-400 py-10 text-xs">
                                <i class="bi bi-wifi-off text-3xl block mb-2 opacity-50"></i>
                                Ошибка подключения к серверу
                            </div>`;
                    }
                }
            }
        }

        function renderView() {
            const container = document.getElementById('tab-content');

            if (currentTab === 'deals') {
                container.innerHTML = `
                    <div class="text-center my-3">
                        <div class="text-xs text-slate-400 font-medium mb-0.5">Рабочий депозит</div>
                        <div class="text-3xl font-extrabold tracking-tight text-white mb-2" id="deposit-display">
                            $${userDeposit}<span class="text-xl text-slate-400 font-normal">.00</span>
                        </div>
                        <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-semibold">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span id="scan-status">Сканирование стаканов...</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 mb-5">
                        <button onclick="changeDeposit()" class="wallet-btn p-3.5 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center text-lg">
                                <i class="bi bi-wallet2"></i>
                            </div>
                            <div class="text-left">
                                <div class="text-xs font-bold text-white">Депозит</div>
                                <div class="text-[10px] text-slate-400">Изменить сумму</div>
                            </div>
                        </button>
                        <button onclick="fetchDeals()" class="wallet-btn p-3.5 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg">
                                <i class="bi bi-arrow-repeat"></i>
                            </div>
                            <div class="text-left">
                                <div class="text-xs font-bold text-white">Обновить</div>
                                <div class="text-[10px] text-slate-400">Ручной поиск</div>
                            </div>
                        </button>
                    </div>

                    <div class="mb-3 flex justify-between items-center px-1">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Прибыльные связки</span>
                        <span class="text-xs text-slate-500" id="deal-count">Анализ...</span>
                    </div>

                    <div class="space-y-2.5" id="deals-container">
                        <div class="text-center text-slate-500 py-10 text-xs">
                            <i class="bi bi-arrow-repeat text-2xl block mb-2 animate-spin text-sky-400"></i>
                            Загрузка рынка...
                        </div>
                    </div>
                `;
                fetchDeals();
            } else if (currentTab === 'exchanges') {
                container.innerHTML = `
                    <div class="text-center my-4">
                        <h2 class="text-lg font-bold text-white">Мониторинг бирж</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Анализ глубин стаканов (Order Books)</p>
                    </div>
                    <div class="space-y-2">
                        <div class="wallet-card p-3.5 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xs">BY</div>
                                <div><div class="font-bold text-sm text-white">Bybit</div><div class="text-[10px] text-slate-400">Спот • Taker 0.1%</div></div>
                            </div>
                            <span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full">Активна</span>
                        </div>
                        <div class="wallet-card p-3.5 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold text-xs">GT</div>
                                <div><div class="font-bold text-sm text-white">Gate.io</div><div class="text-[10px] text-slate-400">Спот • Taker 0.2%</div></div>
                            </div>
                            <span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full">Активна</span>
                        </div>
                        <div class="wallet-card p-3.5 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold text-xs">BG</div>
                                <div><div class="font-bold text-sm text-white">Bitget</div><div class="text-[10px] text-slate-400">Спот • Taker 0.1%</div></div>
                            </div>
                            <span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full">Активна</span>
                        </div>
                        <div class="wallet-card p-3.5 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">MX</div>
                                <div><div class="font-bold text-sm text-white">MEXC</div><div class="text-[10px] text-slate-400">Спот • Taker 0.1%</div></div>
                            </div>
                            <span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full">Активна</span>
                        </div>
                    </div>`;
            } else if (currentTab === 'stats') {
                container.innerHTML = `
                    <div class="text-center my-4">
                        <h2 class="text-lg font-bold text-white">Метрики алгоритма</h2>
                    </div>
                    <div class="wallet-card p-4 space-y-3 text-xs text-slate-300">
                        <div class="flex justify-between border-b border-slate-700/50 pb-2">
                            <span class="text-slate-400">Учет ликвидности:</span>
                            <span class="font-semibold text-emerald-400">Глубина стаканов (VWAP)</span>
                        </div>
                        <div class="flex justify-between border-b border-slate-700/50 pb-2">
                            <span class="text-slate-400">Торговые комиссии:</span>
                            <span class="font-semibold text-emerald-400">Учтены (Taker)</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Комиссии сетей:</span>
                            <span class="font-semibold text-emerald-400">Динамический расчет</span>
                        </div>
                    </div>`;
            } else if (currentTab === 'profile') {
                const username = tg.initDataUnsafe?.user?.first_name || "Трейдер";
                container.innerHTML = `
                    <div class="wallet-card p-5 text-center mb-4">
                        <div class="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-3xl mx-auto mb-3 font-bold border-2 border-emerald-500/40">
                            ${username[0]}
                        </div>
                        <h2 class="text-base font-bold text-white">${username}</h2>
                        <span class="text-[10px] text-emerald-400 font-semibold bg-emerald-500/10 px-2.5 py-0.5 rounded-full inline-block mt-1">PRO Доступ активен</span>
                    </div>`;
            }
        }

        function renderDealsList(data) {
            const listContainer = document.getElementById('deals-container');
            if (!listContainer) return;

            document.getElementById('scan-status').innerText = `Сканирование: ${data.scan_time_sec}s`;
            document.getElementById('deal-count').innerText = `${data.count} найдено`;

            if (!data.deals || data.deals.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center text-slate-500 py-10 text-xs">
                        <i class="bi bi-search text-2xl block mb-2 opacity-50"></i>
                        Поиск прибыльных связок...
                    </div>`;
                return;
            }

            let html = '';
            data.deals.forEach(d => {
                const profitUSD = ((d.profit_pct / 100) * userDeposit).toFixed(2);
                const isPositive = d.profit_pct >= 0;
                const colorClass = isPositive ? 'text-emerald-400' : 'text-rose-400';
                const bgClass = isPositive ? 'bg-emerald-500/10' : 'bg-rose-500/10';

                html += `
                <div class="wallet-card p-3.5 shadow-md">
                    <div class="flex justify-between items-center mb-2.5">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold text-xs border border-sky-500/30">
                                ${d.coin}
                            </div>
                            <div>
                                <div class="font-bold text-sm text-white">${d.symbol}</div>
                                <div class="text-[10px] text-slate-400">Сеть: <span class="text-sky-400 font-medium">${d.network}</span> (~$${d.net_fee})</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="${colorClass} font-extrabold text-base">${isPositive ? '+' : ''}$${profitUSD}</div>
                            <div class="text-[10px] ${colorClass} font-bold ${bgClass} px-1.5 py-0.5 rounded-md inline-block">${isPositive ? '+' : ''}${d.profit_pct}%</div>
                        </div>
                    </div>

                    <div class="wallet-card-sub p-2.5 grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <span class="text-[10px] text-slate-400 block mb-0.5">Купить: <b class="text-slate-200">${d.buy_ex}</b></span>
                            <span class="font-semibold text-slate-100">$${d.buy_price}</span>
                        </div>
                        <div class="border-l border-slate-700/50 pl-2.5">
                            <span class="text-[10px] text-slate-400 block mb-0.5">Продать: <b class="text-slate-200">${d.sell_ex}</b></span>
                            <span class="font-semibold text-slate-100">$${d.sell_price}</span>
                        </div>
                    </div>
                </div>`;
            });

            listContainer.innerHTML = html;
        }

        function changeDeposit() {
            const val = prompt("Введите ваш рабочий депозит ($):", userDeposit);
            if (val && !isNaN(val)) {
                userDeposit = parseFloat(val);
                renderView();
            }
        }

        setInterval(fetchDeals, 2500);
        renderView();
    </script>
</body>
</html>
