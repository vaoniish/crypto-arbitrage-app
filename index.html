<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arbitrage Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #18222d;
      --card-bg: #212d3b;
      --card-secondary: #1c2733;
      --text-main: #ffffff;
      --text-hint: #7e8c9a;
      --accent-blue: #3390ec;
      --accent-green: #2bb368;
      --accent-red: #e53935;
      --badge-bg: rgba(43, 179, 104, 0.15);
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* Верхняя шапка */
    .header {
      padding: 16px 16px 12px 16px;
      background: var(--bg-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--accent-green);
      background: rgba(43, 179, 104, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
    }

    /* Поле ввода депозита (стиль Wallet P2P) */
    .deposit-box {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .deposit-label {
      font-size: 13px;
      color: var(--text-hint);
    }

    .deposit-input-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .deposit-input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 700;
      text-align: right;
      width: 80px;
      outline: none;
    }

    /* Список связок */
    .container {
      padding: 0 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 10px 4px;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .coin-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .coin-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .coin-name {
      font-size: 16px;
      font-weight: 700;
    }

    .coin-net {
      font-size: 12px;
      color: var(--text-hint);
    }

    .profit-tag {
      background: var(--badge-bg);
      color: var(--accent-green);
      padding: 6px 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    /* Детали маршрута (Покупка -> Продажа) */
    .route-box {
      background: var(--card-secondary);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .route-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .route-label {
      color: var(--text-hint);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .route-val {
      font-weight: 600;
    }

    /* Кнопки переходов в стиле Wallet */
    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-trade {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      text-align: center;
      display: block;
    }

    .btn-trade.sell {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    /* Нижнее фиксированное меню (Капсула Wallet) */
    .bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: rgba(33, 45, 59, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-around;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 16px;
      color: var(--text-hint);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      width: 25%;
      cursor: pointer;
    }

    .nav-item.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-icon {
      font-size: 18px;
    }

    /* Лоадер */
    .loader {
      text-align: center;
      padding: 40px 0;
      color: var(--text-hint);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="header">
    <div class="header-top">
      <div class="header-title">Арбитраж</div>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>LIVE SCAN</span>
      </div>
    </div>

    <!-- Поле депозита -->
    <div class="deposit-box">
      <span class="deposit-label">Ваш депозит для расчета:</span>
      <div class="deposit-input-wrapper">
        <input type="number" id="depositInput" class="deposit-input" value="500">
        <span style="font-weight: 700; font-size: 14px; color: var(--text-hint);">$</span>
      </div>
    </div>
  </div>

  <!-- Список связок -->
  <div class="container">
    <div class="section-title">Доступные связки</div>
    <div id="cardsContainer" class="cards-list">
      <div class="loader">Сканирование стаканов бирж...</div>
    </div>
  </div>

  <!-- Нижняя панель навигации (Telegram Wallet Style) -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <span class="nav-icon">⚡</span>
      <span>Связки</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📊</span>
      <span>Рынок</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span>Фильтры</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Профиль</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем на весь экран

    // URL вашего бэкенда на Render
    const BACKEND_URL = "https://arbitrage-backend-z4mq.onrender.com/api/deals";

    const cardsContainer = document.getElementById('cardsContainer');
    const depositInput = document.getElementById('depositInput');

    let currentDeposit = 500;

    // Слушатель изменения депозита
    depositInput.addEventListener('change', (e) => {
      currentDeposit = parseFloat(e.target.value) || 500;
      fetchDeals();
    });

    async function fetchDeals() {
      try {
        const response = await fetch(`${BACKEND_URL}?deposit=${currentDeposit}`);
        const data = await response.json();

        if (data.status === "success" && data.deals.length > 0) {
          renderDeals(data.deals);
        } else {
          cardsContainer.innerHTML = `<div class="loader">Прибыльных связок пока не найдено</div>`;
        }
      } catch (err) {
        cardsContainer.innerHTML = `<div class="loader" style="color: var(--accent-red)">Ошибка подключения к серверу</div>`;
      }
    }

    function renderDeals(deals) {
      cardsContainer.innerHTML = '';

      deals.forEach(deal => {
        const card = document.createElement('div');
        card.className = 'card';

        const isPositive = deal.profit_pct > 0;
        const profitColor = isPositive ? 'var(--accent-green)' : 'var(--accent-red)';
        const badgeBg = isPositive ? 'var(--badge-bg)' : 'rgba(229, 57, 53, 0.15)';

        card.innerHTML = `
          <div class="card-header">
            <div class="coin-info">
              <div class="coin-avatar">${deal.coin.substring(0, 3)}</div>
              <div>
                <div class="coin-name">${deal.symbol}</div>
                <div class="coin-net">${deal.network}</div>
              </div>
            </div>
            <div class="profit-tag" style="color: ${profitColor}; background: ${badgeBg}">
              ${isPositive ? '+' : ''}${deal.profit_pct}% (+$${deal.profit_usd})
            </div>
          </div>

          <div class="route-box">
            <div class="route-row">
              <span class="route-label">🛒 Покупка: <b>${deal.buy_ex}</b></span>
              <span class="route-val">$${deal.buy_price}</span>
            </div>
            <div class="route-row">
              <span class="route-label">💰 Продажа: <b>${deal.sell_ex}</b></span>
              <span class="route-val">$${deal.sell_price}</span>
            </div>
            <div class="route-row" style="margin-top: 4px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px;">
              <span class="route-label">💸 Комиссия сети:</span>
              <span class="route-val" style="color: var(--text-hint)">$${deal.net_fee}</span>
            </div>
          </div>

          <div class="card-actions">
            <a href="${deal.buy_link}" target="_blank" class="btn-trade">Купить на ${deal.buy_ex}</a>
            <a href="${deal.sell_link}" target="_blank" class="btn-trade sell">Продать на ${deal.sell_ex}</a>
          </div>
        `;

        cardsContainer.appendChild(card);
      });
    }

    // Первый запуск и авто-обновление каждые 4 секунды
    fetchDeals();
    setInterval(fetchDeals, 4000);
  </script>
</body>
</html>
