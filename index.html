<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crypto Arbitrage Scanner</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-4 pb-24">

    <!-- 1. ВЕРХНЯЯ ШАПКА -->
    <div>
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Live Scanner</span>
            </div>
            <div class="text-xs text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-full border border-slate-700/50">
                Депозит: <span class="text-sky-400 font-bold">$300</span>
            </div>
        </div>

        <!-- 2. ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМОВ -->
        <div class="bg-slate-800/60 p-1 rounded-xl flex border border-slate-700/50 mb-5">
            <button id="btn-inter" onclick="switchTab('inter')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-sky-500 text-white transition-all duration-200">
                <i class="bi bi-arrow-left-right mr-1"></i> Межбиржевой
            </button>
            <button id="btn-intra" onclick="switchTab('intra')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all duration-200">
                <i class="bi bi-triangle mr-1"></i> Внутрибиржевой
            </button>
        </div>

        <!-- 3. ФИЛЬТРЫ -->
        <div class="bg-slate-800/40 rounded-2xl p-3.5 border border-slate-700/40 mb-5 space-y-3">
            <div class="flex justify-between items-center text-xs text-slate-400">
                <span>Мин. профит: <b class="text-slate-200">+0.25%</b></span>
                <span>Комиссии: <b class="text-emerald-400">Учтены</b></span>
            </div>
        </div>

        <!-- 4. СПИСОК СВЯЗОК -->
        <div class="space-y-3" id="deals-list">
            <div class="text-center text-slate-500 py-12 text-xs">
                <i class="bi bi-search text-2xl block mb-2 opacity-50"></i>
                Поиск плюсовых связок (>0.25%)...
            </div>
        </div>
    </div>

    <!-- 5. НИЖНЯЯ ПАНЕЛЬ -->
    <div class="fixed bottom-3 left-4 right-4 bg-slate-900/90 backdrop-blur-md rounded-2xl p-2 flex justify-around items-center border border-slate-800 shadow-2xl z-50">
        <button class="flex flex-col items-center text-sky-400 text-[10px] font-medium gap-0.5">
            <i class="bi bi-lightning-charge-fill text-lg"></i> Связки
        </button>
        <button class="flex flex-col items-center text-slate-400 hover:text-slate-200 text-[10px] font-medium gap-0.5">
            <i class="bi bi-funnel text-lg"></i> Фильтры
        </button>
        <button class="flex flex-col items-center text-slate-400 hover:text-slate-200 text-[10px] font-medium gap-0.5">
            <i class="bi bi-sliders text-lg"></i> Депозит
        </button>
        <button class="flex flex-col items-center text-slate-400 hover:text-slate-200 text-[10px] font-medium gap-0.5">
            <i class="bi bi-person-circle text-lg"></i> Профиль
        </button>
    </div>

    <!-- 6. СКРИПТЫ И ИНИЦИАЛИЗАЦИЯ -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0f172a');
        tg.setBackgroundColor('#0f172a');

        function switchTab(type) {
            const btnInter = document.getElementById('btn-inter');
            const btnIntra = document.getElementById('btn-intra');
            if(type === 'inter') {
                btnInter.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-sky-500 text-white transition-all duration-200";
                btnIntra.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all duration-200";
            } else {
                btnIntra.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-sky-500 text-white transition-all duration-200";
                btnInter.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all duration-200";
            }
        }

        // Вставь сюда URL от Render.com (добавь /api/deals на конце)
        const BACKEND_URL = "https://arbitrage-backend-z4mq.onrender.com/api/deals";

        async function updateDeals() {
            try {
                const res = await fetch(BACKEND_URL);
                const data = await res.json();
                
                const listContainer = document.getElementById('deals-list');
                
                if(!data.deals || data.deals.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center text-slate-500 py-12 text-xs">
                            <i class="bi bi-search text-2xl block mb-2 opacity-50"></i>
                            Поиск плюсовых связок (>0.25%)...
                        </div>`;
                    return;
                }

                let html = '';
                data.deals.forEach(d => {
                    html += `
                    <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/60 shadow-lg relative">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold text-xs">
                                    ${d.coin}
                                </div>
                                <div>
                                    <div class="font-bold text-sm">${d.symbol}</div>
                                    <div class="text-[10px] text-slate-400">Депозит: $300</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-emerald-400 font-extrabold text-base">+$${d.profit_usd}</div>
                                <div class="text-[10px] text-emerald-500 font-semibold bg-emerald-500/10 px-1.5 py-0.5 rounded-md inline-block">+${d.profit_pct}% чистый</div>
                            </div>
                        </div>
                        <div class="bg-slate-900/60 rounded-xl p-2.5 grid grid-cols-2 gap-2 text-xs border border-slate-800">
                            <div>
                                <span class="text-[10px] text-slate-500 block uppercase">Купить</span>
                                <span class="font-semibold text-slate-200">${d.buy_ex}</span>
                                <span class="text-slate-400 text-[11px] block">$${d.buy_price}</span>
                            </div>
                            <div class="border-l border-slate-800 pl-2.5">
                                <span class="text-[10px] text-slate-500 block uppercase">Продать</span>
                                <span class="font-semibold text-slate-200">${d.sell_ex}</span>
                                <span class="text-slate-400 text-[11px] block">$${d.sell_price}</span>
                            </div>
                        </div>
                    </div>`;
                });

                listContainer.innerHTML = html;
            } catch (e) {
                console.log("Ожидание бэкенда...", e);
            }
        }

        setInterval(updateDeals, 3000);
        updateDeals();
    </script>
</body>
</html>
